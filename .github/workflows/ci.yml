name: CI

on:

  pull_request:

  push:
    branches:
      - main


jobs:

  quality-and-test:

    name: Run CI checks

    runs-on: ubuntu-latest

    services:

      mysql:

        image: mysql:8.0

        env:

          MYSQL_ROOT_PASSWORD: root

          MYSQL_DATABASE: task_management_test

        ports:
          - 3306:3306

    steps:

      - uses: actions/checkout@v4


      - uses: actions/setup-python@v5

        with:

          python-version: "3.10"


      - name: Install

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          pip install -r requirements-dev.txt


      - name: Create test env

        run: |

          cp .env.test.example .env.test

          echo "DB_PASSWORD=root" >> .env.test


      - name: Ruff

        run: |

          ruff check .


      - name: Black

        run: |

          black --check .

      - name: Wait for MySQL

        run: |

          sudo apt-get update

          sudo apt-get install -y mysql-client

          for i in {1..30}
          do

            mysql \
            -h 127.0.0.1 \
            -u root \
            -proot \
            -e "SELECT 1" \
            && break

            echo "Waiting..."

            sleep 2

          done

      - name: Run migration

        env:
          ENV_FILE: .env.test

        run: |

          flask db upgrade


      - name: Run tests

        run: |

          pytest \
          --cov=app \
          --cov-report=term
