name: CI

on:

  pull_request:

  push:
    branches:
      - main


jobs:

  quality-and-test:

    runs-on: ubuntu-latest

    services:

      mysql:

        image: mysql:8

        env:

          MYSQL_ROOT_PASSWORD: root

          MYSQL_DATABASE: task_management_test

        ports:
          - 3306:3306

        options: >-

          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"

          --health-interval=10s

          --health-timeout=5s

          --health-retries=10


    steps:

      - uses: actions/checkout@v4


      - uses: actions/setup-python@v5

        with:

          python-version: "3.10"


      - name: Install

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      - name: Create test env

        run: |

          cp .env.test.example .env.test

          echo "DB_PASSWORD=root" >> .env.test


      - name: Ruff

        run: |

          ruff check .


      - name: Black

        run: |

          black --check .


      - name: Run migration

        run: |

          export ENV_FILE=.env.test
          flask db upgrade


      - name: Run tests

        run: |

          pytest \
          --cov=app \
          --cov-report=term
