[tool.ruff]
line-length = 88

[tool.black]
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = [
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# fail_under = 80

[tool.coverage.xml]
output = "coverage.xml"